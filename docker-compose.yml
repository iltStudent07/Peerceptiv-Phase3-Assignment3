services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./api
    ports:
      - "4000:4000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/compose-demo
      - NODE_ENV=production
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mongo-data: